# Releases with release-please, then deploys the released version to the OVH VPS
# (rootless podman as user arena, Cloudflare Tunnel altered-arena.yutsa.fr -> 127.0.0.1:8080).
#
# Every push to main updates the release PR (CHANGELOG + version) from Conventional Commits
# (feat:, fix:, perf:, feat!: ...). Merging that PR creates the tag and the GitHub release,
# and this workflow then builds the image and deploys it. "Run workflow" redeploys an
# existing version (e.g. 0.2.0).
#
# Secrets of the GitHub environment `production`:
#   VPS_HOST         hostname of the VPS
#   VPS_SSH_KEY      private key whose public key is the forced-command key of user arena
#                    (deploy/vps/arena-deploy)
#   VPS_KNOWN_HOSTS  ssh-keyscan output of the VPS (pinned host keys)

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to deploy again, e.g. 0.2.0"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release-please
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.release-please.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://altered-arena.yutsa.fr/
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.release-please.outputs.version }}
    steps:
      - name: Check version
        run: '[[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad version: $VERSION"; exit 1; }'

      - name: Checkout altered-arena v${{ env.VERSION }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ env.VERSION }}
          path: altered-arena

      - name: Checkout card art (AlteredBGA)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: EdouardWillisseck/AlteredBGA
          ref: master
          path: AlteredBGA
          sparse-checkout: img/illustrations

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: altered-arena/Dockerfile
          platforms: linux/amd64
          tags: localhost/altered-arena:${{ env.VERSION }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          docker save "localhost/altered-arena:$VERSION" | gzip -1 \
            | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
                "arena@$VPS_HOST" "deploy $VERSION"

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null https://altered-arena.yutsa.fr/ && exit 0
            sleep 3
          done
          echo "https://altered-arena.yutsa.fr/ does not answer" >&2
          exit 1
